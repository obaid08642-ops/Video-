<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Nabd style frame</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ddd;font-family:'IBM Plex Sans Arabic',sans-serif}
.ph{width:360px;height:640px;background:#EFE6D6;position:relative;overflow:hidden}
.cap{font-weight:700;font-size:30px;line-height:1.45;color:#2B2A28;text-align:center;position:absolute;top:86px;left:20px;right:20px;transition:opacity .25s}
.cap b{color:#D9622B}.cap i{font-style:normal;color:#C23B32;text-decoration:underline;text-decoration-thickness:3px}
.tag{position:absolute;top:20px;right:22px;font-size:15px;font-weight:700;color:#D9622B}
.badge{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#2B2A28}
.lock{position:absolute;width:64px;height:64px;border-radius:50%;background:#CFE0EE;border:3px solid #2B2A28;display:flex;align-items:center;justify-content:center;transition:all .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<!-- Reference only: colors, type, layout, motion feel. Rebuild in Remotion. -->
<div class="ph">
<div class="tag">#الأدوية</div>
<div class="badge"><svg width="36" height="36" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#FE5D54"/><circle cx="50" cy="32" r="8" fill="#fff"/><path d="M27 52 A23 23 0 0 0 73 52" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>نبض</div>
<div class="cap" id="cap"></div>
<div class="lock" id="lock"><svg width="30" height="34" viewBox="0 0 30 34"><rect x="2" y="14" width="26" height="18" rx="3" fill="#D9622B" stroke="#2B2A28" stroke-width="2.5"/><path d="M8 14V9a7 7 0 0 1 14 0v5" fill="none" stroke="#2B2A28" stroke-width="2.5"/><circle cx="15" cy="23" r="3" fill="#2B2A28"/></svg></div>
<svg viewBox="0 0 300 300" style="position:absolute;bottom:0;left:0;width:100%">
<rect x="0" y="210" width="300" height="90" fill="#E7B79C"/>
<path d="M0 210 Q75 200 150 210 T300 210" fill="none" stroke="#2B2A28" stroke-width="2.5"/>
<g style="transform-origin:200px 120px;animation:spin 9s linear infinite"><g fill="none" stroke="#2B2A28" stroke-width="2.5"><line x1="200" y1="82" x2="200" y2="96"/><line x1="200" y1="144" x2="200" y2="158"/><line x1="162" y1="120" x2="176" y2="120"/><line x1="224" y1="120" x2="238" y2="120"/><line x1="174" y1="94" x2="183" y2="103"/><line x1="217" y1="137" x2="226" y2="146"/><line x1="226" y1="94" x2="217" y2="103"/><line x1="183" y1="137" x2="174" y2="146"/></g>
<circle cx="200" cy="120" r="25" fill="#B7A3D6" stroke="#2B2A28" stroke-width="2.5"/><circle cx="192" cy="113" r="4" fill="#8E78B8"/><circle cx="207" cy="127" r="5" fill="#8E78B8"/></g>
<g id="pill" style="transition:transform .9s cubic-bezier(.5,0,.3,1)"><g style="animation:bob 1.6s ease-in-out infinite"><g transform="rotate(-25 90 130)"><rect x="60" y="114" width="60" height="32" rx="16" fill="#F7F1E8" stroke="#2B2A28" stroke-width="2.5"/><path d="M90 114 H104 A16 16 0 0 1 104 146 H90 Z" fill="#FE5D54" stroke="#2B2A28" stroke-width="2.5"/><rect x="68" y="120" width="12" height="5" rx="2.5" fill="#fff"/></g></g></g>
<g id="xx" style="opacity:0;transition:opacity .3s"><line x1="60" y1="95" x2="120" y2="165" stroke="#C23B32" stroke-width="6" stroke-linecap="round"/><line x1="120" y1="95" x2="60" y2="165" stroke="#C23B32" stroke-width="6" stroke-linecap="round"/></g>
</svg></div>
<script>
const S=[
{t:'الدكتور <b>رفض</b><br>يكتبلك مضاد؟!',p:'translate(0,0)',x:0,l:'top:280px;left:148px;transform:scale(0)'},
{t:'البرد سببه <b>فيروس</b>...',p:'translate(110px,-10px)',x:0,l:'top:280px;left:148px;transform:scale(0)'},
{t:'والمضاد الحيوي<br><i>مبيقتلوش</i>.',p:'translate(110px,-10px)',x:1,l:'top:280px;left:148px;transform:scale(0)'},
{t:'وفي الآخر هقولك<br><b>الرقم</b>',p:'translate(0,0)',x:1,l:'top:250px;left:148px;transform:scale(1.3)'},
{t:'وفي الآخر هقولك<br><b>الرقم</b>',p:'translate(0,0)',x:0,l:'top:190px;left:276px;transform:scale(.75)'}];
let i=0;const c=cap,pl=document.getElementById('pill'),xx=document.getElementById('xx'),lk=document.getElementById('lock');
function go(){const s=S[i];c.style.opacity=0;setTimeout(()=>{c.innerHTML=s.t;c.style.opacity=1},250);pl.style.transform=s.p;xx.style.opacity=s.x;lk.style.cssText=s.l;i=(i+1)%S.length}
go();setInterval(go,2200);
</script></body></html>
